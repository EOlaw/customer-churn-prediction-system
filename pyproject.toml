[project]
name = "customer-churn-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "numpy>=2,<3",
  "python-multipart>=0.0.9,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]
[project.scripts]
churn-train = "churn.ml.train:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

